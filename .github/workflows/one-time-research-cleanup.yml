name: One-time research page cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-research-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run research page cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update research page and spacing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('research.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              'Research interests, publications, working papers, and public data and code by economist Syed Abul Basher.',
              'Publications, working papers, book chapters and reviews, and other research by economist Syed Abul Basher.'
          )

          s = re.sub(
              r'<section class="page-intro"><h1>Research</h1><p>.*?</p></section>',
              '<section class="page-intro"><h1>Research</h1><p>This page brings together my published articles, working papers, book chapters and reviews, unpublished work, and dissertation.</p></section>',
              s,
              count=1,
              flags=re.S
          )

          s = re.sub(
              r'<section class="section"><h2>Research interests</h2><ul class="interest-list">.*?</ul></section>',
              '',
              s,
              count=1,
              flags=re.S
          )

          # Remove the small SSRN / Publisher / RePEc / DOI labels while retaining title links.
          s = re.sub(r'\s*<a class="pub-extra"[^>]*>.*?</a>', '', s, flags=re.S)

          # Keep current professional identity consistent across the site.
          s = s.replace('Economist and Independent Researcher · Gold River Analytics', 'Economist and Independent Researcher')
          s = s.replace(',"affiliation":{"@type":"Organization","name":"Gold River Analytics"}', '')

          p.write_text(s, encoding='utf-8')

          css = Path('assets/styles.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('.year-block{padding:2px 0 12px}', '.year-block{padding:2px 0 0}')
          c = c.replace('.year-block+.year-block{margin-top:22px;padding-top:28px;border-top:2px solid var(--line)}', '.year-block+.year-block{margin-top:12px;padding-top:18px;border-top:2px solid var(--line)}')
          if '.year-block .publication-list li:last-child{padding-bottom:4px}' not in c:
              c = c.replace('.publication-list li:last-child{border-bottom:0}', '.publication-list li:last-child{border-bottom:0}\n.year-block .publication-list li:last-child{padding-bottom:4px}')
          css.write_text(c, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "SyedBasher"
          git config user.email "124018240+SyedBasher@users.noreply.github.com"
          git add research.html assets/styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Simplify research page and tighten year spacing"
          git push
