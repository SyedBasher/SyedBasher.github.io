name: One-time research trim

on:
  push:
    paths:
      - '.github/workflows/one-time-research-trim.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trim research page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('research.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<p class="note">Grouped by publication year. Links point to a DOI, publisher, SSRN, RePEc, JSTOR, or an available manuscript.</p>', '')

          s = re.sub(
              r'<section class="section"[^>]*>\s*<h2>Data and code</h2>.*?</section>',
              '', s, flags=re.S | re.I
          )

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "SyedBasher"
          git config user.email "124018240+SyedBasher@users.noreply.github.com"
          git add research.html
          git commit -m "Trim research page text and remove data code section" || exit 0
          git push
