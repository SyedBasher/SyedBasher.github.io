name: Archive old site

on:
  push:
    paths:
      - '.github/workflows/archive-old-site.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive current site files
        run: |
          set -euo pipefail
          rm -f "old files.zip"
          zip -q -r "old files.zip" \
            .nojekyll 404.html README.md about.html advisory.html applied-work.html \
            assets index.html research.html robots.txt sitemap.xml writing.html \
            -x '.site-upload/*' '.github/*'
      - name: Clean temporary staging files
        run: |
          rm -rf .site-upload
          rm -f .github/workflows/install-improved-site.yml
          rm -f .github/workflows/archive-old-site.yml
      - name: Commit archive
        run: |
          git config user.name "SyedBasher"
          git config user.email "124018240+SyedBasher@users.noreply.github.com"
          git add -A
          git commit -m "Archive previous website files" || exit 0
          git push
